name: Selfhost Release

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = CST 09:00
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to build (defaults to main)"
        required: false
        default: "main"
      run-cli:
        description: "Release CLI binary via GoReleaser (requires a semver tag ref)"
        required: false
        type: boolean
        default: false
      run-backend:
        description: "Build & push backend Docker image"
        required: false
        type: boolean
        default: true
      run-web:
        description: "Build & push web Docker image"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Compute tag name and push git tag
        id: meta
        shell: bash
        run: |
          short_sha=$(git rev-parse --short HEAD)
          tag="main-${short_sha}"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building image tag: ${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create and push the tag only if it doesn't already exist
          if ! git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            git tag "${tag}"
            git push origin "${tag}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.run-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser (skip homebrew)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag_name }}

  docker-backend-build:
    needs: prepare
    if: github.event_name == 'schedule' || inputs.run-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Compute backend image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.tag_name }}
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dispatch-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=dispatch-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag_name }}
            COMMIT=${{ github.sha }}

  docker-web-build:
    needs: prepare
    if: github.event_name == 'schedule' || inputs.run-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Compute web image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.tag_name }}
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dispatch-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=dispatch-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.tag_name }}
