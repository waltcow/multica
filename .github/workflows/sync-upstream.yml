# Syncs multica-ai/multica@main into this fork via sync-upstream/main PRs.
#
# Required secret: SYNC_UPSTREAM_TOKEN — fine-grained or classic PAT with
# Contents (read/write), Pull requests (read/write), and Workflows (read/write)
# on waltcow/multica. Needed when upstream changes .github/workflows/*.
name: Sync Upstream

on:
  schedule:
    - cron: "0 23 * * *" # UTC 23:00 = CST 07:00
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    if: github.repository == 'waltcow/multica'
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # full history is required for a 3-way merge
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5 # reads packageManager from package.json (pnpm@10.28.2)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and resolve lockfile conflicts
        id: merge
        env:
          UPSTREAM_REPO: multica-ai/multica
          UPSTREAM_BRANCH: main
          SYNC_UPSTREAM_TOKEN_CONFIGURED: ${{ secrets.SYNC_UPSTREAM_TOKEN != '' }}
        run: |
          set -euo pipefail

          BASE_SHA="$(git rev-parse HEAD)"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}"

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            # Merge produced conflicts — inspect which files.
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            echo "Conflicted files: ${CONFLICTS[*]-}"
            echo "conflicts=${CONFLICTS[*]-}" >> "$GITHUB_OUTPUT"

            # Any conflict outside the lockfile must be resolved by a human.
            NON_LOCK=()
            for f in "${CONFLICTS[@]}"; do
              case "$f" in
                pnpm-lock.yaml) ;;
                *) NON_LOCK+=("$f") ;;
              esac
            done

            if [ "${#NON_LOCK[@]}" -gt 0 ]; then
              echo "::error::Unresolvable conflicts require manual merge: ${NON_LOCK[*]}"
              git merge --abort
              exit 1
            fi

            # Only pnpm-lock.yaml conflicts — regenerate from the merged package.json.
            echo "Only lockfile conflicts detected — regenerating pnpm-lock.yaml..."
            git checkout --theirs pnpm-lock.yaml || true
            pnpm install --lockfile-only
            git add pnpm-lock.yaml
            git commit --no-edit
          else
            echo "Clean merge — no conflicts."
          fi

          if [ "$(git rev-parse HEAD)" = "${BASE_SHA}" ]; then
            echo "No upstream changes to sync."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}"..HEAD)"
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          if echo "${CHANGED_FILES}" | grep -q '^.github/workflows/' && [ "${SYNC_UPSTREAM_TOKEN_CONFIGURED}" != "true" ]; then
            echo "::error::Upstream changed GitHub workflow files. Configure a SYNC_UPSTREAM_TOKEN secret with Contents and Workflows write access so the sync branch can be pushed."
            exit 1
          fi

          UPSTREAM_SHA="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "sync_needed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Report merge failure
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Upstream sync failed: manual merge required"
          BODY="$(printf "%s\n\n%s\n\n%s\n\n%s\n" \
            "The scheduled upstream sync could not merge automatically." \
            "Conflicted files: \`${CONFLICTS:-unknown}\`" \
            "Workflow run: ${RUN_URL}" \
            "Resolve conflicts locally, push to \`sync-upstream/main\`, and open a PR — or fix on \`main\` and re-run the workflow.")"

          EXISTING="$(gh issue list \
            --search "in:title \"${TITLE}\"" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            echo "Updated existing issue #${EXISTING}."
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label "sync-upstream"
          fi

      - name: Push sync branch
        id: push
        if: steps.merge.outputs.sync_needed == 'true'
        env:
          SYNC_BRANCH: sync-upstream/main
        run: |
          set -euo pipefail

          git push --force-with-lease origin "HEAD:${SYNC_BRANCH}"
          echo "branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        if: steps.merge.outputs.sync_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}
          SYNC_BRANCH: ${{ steps.push.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          gh label create "sync-upstream" \
            --color "0366d6" \
            --description "Automated upstream sync PR or failure report" \
            2>/dev/null || true

          TITLE="chore(sync): sync upstream main"
          BODY="$(printf "%s\n\n%s\n\n%s\n" \
            "Automated sync from multica-ai/multica@main." \
            "Upstream commit: ${UPSTREAM_SHA}" \
            "This PR is opened instead of pushing directly to main so upstream changes, including workflow changes, can be reviewed before merge.")"

          PR_NUMBER="$(gh pr list \
            --base main \
            --head "${SYNC_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --title "${TITLE}" --body "${BODY}" --add-label "sync-upstream"
            echo "Updated sync PR #${PR_NUMBER}."
          else
            gh pr create \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "sync-upstream"
          fi
