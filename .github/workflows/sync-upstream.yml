name: Sync Upstream

on:
  schedule:
    - cron: "0 23 * * *" # UTC 23:00 = CST 07:00
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    permissions:
      contents: write      

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # full history is required for a 3-way merge

      - name: Setup pnpm
        uses: pnpm/action-setup@v5 # reads packageManager from package.json (pnpm@10.28.2)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and resolve lockfile conflicts
        env:
          UPSTREAM_REPO: multica-ai/multica
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}"

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Clean merge — no conflicts."
            exit 0
          fi

          # Merge produced conflicts — inspect which files.
          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
          echo "Conflicted files: ${CONFLICTS[*]-}"

          # Any conflict outside the lockfile must be resolved by a human.
          NON_LOCK=()
          for f in "${CONFLICTS[@]}"; do
            case "$f" in
              pnpm-lock.yaml) ;;
              *) NON_LOCK+=("$f") ;;
            esac
          done

          if [ "${#NON_LOCK[@]}" -gt 0 ]; then
            echo "::error::Unresolvable conflicts require manual merge: ${NON_LOCK[*]}"
            git merge --abort
            exit 1
          fi

          # Only pnpm-lock.yaml conflicts — regenerate from the merged package.json.
          echo "Only lockfile conflicts detected — regenerating pnpm-lock.yaml..."
          git checkout --theirs pnpm-lock.yaml || true
          pnpm install --lockfile-only
          git add pnpm-lock.yaml
          git commit --no-edit

      - name: Push synced main
        run: git push origin main